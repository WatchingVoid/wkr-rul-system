services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wkr
      POSTGRES_PASSWORD: wkr
      POSTGRES_DB: wkr
    ports:
      - "127.0.0.1::5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wkr -d wkr"]
      interval: 40s
      timeout: 30s
      retries: 10
  
  flyway:
    image: flyway/flyway:10
    command: >
      -url=jdbc:postgresql://db:5432/wkr
      -user=wkr
      -password=wkr
      -connectRetries=60
      migrate
    volumes:
      - ../db/migrations:/flyway/sql
    depends_on:
      db:
        condition: service_healthy
  
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - db

  ml:
    build:
      context: ../ml-service
      dockerfile: Dockerfile
    environment:
      MODEL_PATH: /app/model.joblib
      MODEL_VERSION: external
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend/Backend.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8000
      ConnectionStrings__Pg: Host=db;Port=5432;Database=wkr;Username=wkr;Password=wkr
      Ml__BaseUrl: http://ml:8001
      Rul__WindowSize: "50"
      Rul__PeriodSeconds: "5"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy

volumes:
  pgdata: